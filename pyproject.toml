[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-postmortem"
version = "0.1.0"
description = "Turn LLM call logs into an actionable failure postmortem."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "llm-postmortem contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
llm-postmortem = "llm_postmortem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
